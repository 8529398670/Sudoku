<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title data-i18n="history.title">&nbsp;</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="history-page">
  <!--
    One player's play history, for an admin: their visits and their games,
    with downloads and a replay of each game (history-page.js). The data
    comes from /api/admin/users/:id/history, which refuses anyone else.
  -->
  <header class="app-header">
    <div>
      <a class="back-link" href="/account.html" data-i18n="history.back"></a>
      <h1 id="history-heading" data-i18n="history.title"></h1>
      <p class="muted" data-i18n="history.description"></p>
    </div>
  </header>

  <main hidden id="main">
    <section class="card">
      <div class="history-head">
        <h2 id="player-name"></h2>
        <a id="download-all" class="button" href="#" download data-i18n="history.download_all"></a>
      </div>
      <p id="history-totals" class="muted history-totals"></p>
    </section>

    <section class="card">
      <h2 data-i18n="history.sessions_heading"></h2>
      <p class="muted" data-i18n="history.sessions_hint"></p>
      <div class="table-scroll">
        <table id="sessions-table">
          <thead>
            <tr>
              <th data-i18n="history.col_started"></th>
              <th data-i18n="history.col_ended"></th>
              <th data-i18n="history.col_duration"></th>
              <th data-i18n="history.col_device"></th>
              <th data-i18n="history.col_games"></th>
              <th data-i18n="history.col_events"></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="no-sessions" class="muted" data-i18n="history.none_sessions" hidden></p>
    </section>

    <section class="card">
      <h2 data-i18n="history.games_heading"></h2>
      <div id="games-filter" class="history-filter notice notice-ok" hidden>
        <p id="games-filter-text"></p>
        <button id="games-filter-clear" class="secondary small" type="button" data-i18n="history.show_all"></button>
      </div>
      <div class="table-scroll">
        <table id="games-table">
          <thead>
            <tr>
              <th data-i18n="history.col_game"></th>
              <th data-i18n="history.col_started"></th>
              <th data-i18n="history.col_ended"></th>
              <th data-i18n="history.col_outcome"></th>
              <th data-i18n="history.col_active"></th>
              <th data-i18n="history.col_wall"></th>
              <th data-i18n="history.col_mistakes"></th>
              <th data-i18n="history.col_hints"></th>
              <th data-i18n="history.col_moves"></th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="no-games" class="muted" data-i18n="history.none_games" hidden></p>
    </section>

    <p id="error-banner" class="notice notice-error" hidden></p>
  </main>

  <script src="/js/dom.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/history-page.js"></script>
</body>
</html>
