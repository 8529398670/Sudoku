  # Building blocks for the sentences below.
  cell: "R{row}C{col}"
  unit_row: "row {n}"
  unit_col: "column {n}"
  unit_box: "box {n}"
  kind_row: "row"
  kind_rows: "rows"
  kind_col: "column"
