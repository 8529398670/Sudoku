  count_5: "five"
  count_6: "six"
  count_7: "seven"
  count_8: "eight"
  count_9: "nine"
  colour_a: "green"
  colour_b: "blue"

  name:
    hidden_single: "Hidden single"
    naked_single: "Naked single"
    pointing: "Pointing pair"
    claiming: "Box/line reduction"
    naked_pair: "Naked pair"
    hidden_pair: "Hidden pair"
    naked_triple: "Naked triple"
    hidden_triple: "Hidden triple"
    x_wing: "X-Wing"
    skyscraper: "Skyscraper"
    two_string_kite: "2-String Kite"
    rectangle_elimination: "Rectangle Elimination"
    xy_wing: "XY-Wing"
    xyz_wing: "XYZ-Wing"
    swordfish: "Swordfish"
    simple_coloring: "Simple coloring"
    finned_x_wing: "Finned X-Wing"
    w_wing: "W-Wing"
    remote_pair: "Remote pair"
    unique_rectangle: "Unique rectangle"
    unique_rectangle_2: "Unique rectangle (type 2)"
    unique_rectangle_4: "Unique rectangle (type 4)"
    bug_plus_one: "BUG+1"
    naked_quad: "Naked quad"
    hidden_quad: "Hidden quad"
    jellyfish: "Jellyfish"
    xy_chain: "XY-Chain"

  mistake:
    title: "Mistake"
    nudge: "Something on the board is wrong."
    show: "The highlighted number is wrong."
    answer: "{cell} is wrong. Erase it and look again."

  note_mistake:
    title: "Pencil-mark mistake"
    nudge: "One of your pencil marks has crossed out the right answer."
    show: "Have another look at the candidates in {cell}."
    answer: "{cell} can still be {digit}. Put it back."

  hidden_single:
    nudge: "Look at {unit}. There's only one place left for a {digit}."
    show: "{unit} needs a {digit}. Find the one empty cell that can take it."
    w1: "Every {kind} needs exactly one {digit}. Look at {unit}: it doesn't have its {digit} yet."
    w2: "The greyed-out cells are already filled, so the {digit} can't go there."
    w3: "Each of the other empty cells already sees a {digit} along its row, column or box -- follow the arrows. A {digit} there would repeat."
    w3_marks: "The other empty cells are ruled out too. Most already see a {digit} along their row, column or box; the rest have had {digit} crossed out of their candidates."
    answer: "That leaves {cell} as the only place in {unit} for the {digit}."

  naked_single:
    nudge: "One empty cell has only one number left that can go in it."
    show: "Look at {cell}. Check which numbers its row, column and box already use."
    w1: "Focus on {cell}. It can't repeat any number already in its row, column or box."
    unit: "{unit} already has {digits}."
    unit_none: "{unit} adds nothing new."
    marks: "Your candidates have also ruled out {digits}."
    answer: "Every number except {digit} is ruled out, so {cell} must be {digit}."

  pointing:
    nudge: "In one box, all the {digit}s line up on a single row or column."
    show: "In {first}, every place for the {digit} lies on {second}."
    w1: "Focus on the {digit}s."
    w2: "{first} needs a {digit}, and these {n} cells are the only places it can go."
    w3: "All of them are on {second}. Whichever one gets the {digit}, that is also {second}'s {digit}."
    answer: "So {second} can't have a {digit} anywhere outside {first}. Remove the {digit} from {targets}."

  claiming:
    nudge: "In one row or column, all the {digit}s sit inside a single box."
    show: "In {first}, every place for the {digit} is inside {second}."
    w1: "Focus on the {digit}s."
    w2: "{first} needs a {digit}, and these {n} cells are the only places it can go."
    w3: "All of them are inside {second}. Whichever one gets the {digit}, that is also {second}'s {digit}."
    answer: "So the rest of {second} can't have a {digit}. Remove the {digit} from {targets}."

  naked_subset:
    nudge: "In {unit}, {n} cells share just {n} candidates between them."
    show: "These {n} cells in {unit} hold only {digits} between them."
    w1: "Look at {unit} and its candidates."
    w2: "These {n} cells ({cells}) contain nothing but {digits}."
    w3: "{n} cells and {n} digits: each of those digits has to land in one of these cells. Which goes where doesn't matter yet -- the digits are used up."
    answer: "So no other cell in {unit} can be {digits}. Remove them from {targets}."

  hidden_subset:
    nudge: "In {unit}, {n} digits fit in only {n} cells."
    show: "In {unit}, the digits {digits} only fit in these {n} cells."
    w1: "Look at {unit} and its candidates."
    w2: "Where can {digits} go in {unit}? Only in {cells}."
    w3: "{n} digits need {n} cells, and these are the only cells they can use -- so these cells are taken by them."
    answer: "That means {cells} can't hold anything else. Remove their other candidates."

  fish:
    nudge: "There's a {name} on the {digit}s."
    show: "In {bases}, the {digit} only appears in {covers}."
    w1: "Focus on the {digit}s."
    line: "{line} has the {digit} in just {n} places."
    cover: "Together, {bases} only use {covers} for their {digit}s."
    either_x: "Each of these two {baseKinds} needs its own {digit}, and they can't share one, so they take opposite corners -- one diagonal or the other. Either way, {covers} each get a {digit} from them."
    either: "These {n} {baseKinds} need {n} {digit}s, and only {n} {coverKinds} are available. So each of {covers} gets exactly one {digit} from them."
    answer: "That fills {covers}. Any other {digit} in them has to go: remove it from {targets}."

  skyscraper:
    nudge: "Look for a skyscraper on the {digit}s: two lines with only two {digit}s each."
    show: "{line1} and {line2} each have only two {digit}s, and two of the ends share {cross}."
    w1: "Focus on the {digit}s."
    w2: "{line1} has only two {digit}s: {base1} and {roof1}. One of them must be the {digit}."
    w3: "{line2} is the same: it's {base2} or {roof2}."
    w4: "{base1} and {base2} are both in {cross}, so they can't both be {digit}."
    w5: "Follow it through: if {roof1} isn't {digit}, then {base1} is, so {base2} isn't, so {roof2} is. Either way, one of {roof1} and {roof2} is the {digit}."
    answer: "Any cell that sees both {roof1} and {roof2} can't be {digit}. Remove it from {targets}."

  two_string_kite:
    nudge: "Look for a 2-string kite on the {digit}s."
    show: "{row} and {col} each have only two {digit}s, and one end of each meets in {box}."
    w1: "Focus on the {digit}s."
    w2: "{row} has only two {digit}s: {rowInner} and {rowEnd}."
    w3: "{col} has only two {digit}s: {colInner} and {colEnd}."
    w4: "{rowInner} and {colInner} are both in {box}, so they can't both be {digit}."
    w5: "So one of the far ends is the {digit}: if {rowEnd} isn't, then {rowInner} is, {colInner} isn't, and {colEnd} is."
    answer: "A cell that sees both {rowEnd} and {colEnd} can't be {digit}. Remove it from {targets}."

  rectangle_elimination:
    nudge: "One {digit} would wipe out every {digit} in a box. Look for a rectangle elimination."
    show: "{link} has only two {digit}s. Think about what would happen if {wing} were a {digit}."
    w1: "Focus on the {digit}s."
    w2: "{link} has just two {digit}s: {hinge} and {strong}. One of them is the {digit}."
    w3: "Now suppose {wing} were the {digit}."
    w4: "It shares {wingLine} with {hinge}, so {hinge} couldn't be {digit}..."
    w5: "...which forces {strong} to be the {digit}."
    w6: "Now look at {box}: every {digit} in it sees either {wing} or {strong}. The box would be left with no {digit} at all."
    answer: "That's impossible, so {wing} can't be {digit}. Remove it.{more}"
    more: " The same goes for {wings}."

  xy_wing:
    nudge: "Three cells with two candidates each are working together: look for an XY-Wing."
    show: "{pivot} can be {a} or {b}. It sees {p1} ({a} or {z}) and {p2} ({b} or {z})."
    w1: "Start with the pivot, {pivot}. It can only be {a} or {b}."
    w2: "If it's {a}, then {p1} loses its {a} and must be {z}."
    w3: "If it's {b}, then {p2} loses its {b} and must be {z}."
    either: "Either way, one of {p1} and {p2} is {z}."
    answer: "So a cell that sees both {p1} and {p2} can't be {z}. Remove it from {targets}."

  xyz_wing:
    nudge: "A three-candidate cell and two pincers: look for an XYZ-Wing."
    show: "{pivot} can be {pivotDigits}. It sees {p1} ({a} or {z}) and {p2} ({b} or {z})."
    w1: "Start with the pivot, {pivot}. It can be {pivotDigits}."
    w2: "If it's {a}, then {p1} must be {z}."
    w3: "If it's {b}, then {p2} must be {z}."
    w4: "And if it's {z}, the pivot itself is the {z}."
    either: "So one of these three cells is always the {z}."
    answer: "A cell that sees all three of them can't be {z}. Remove it from {targets}."

  simple_coloring:
    nudge: "Try coloring the {digit}s. Follow the places where a unit has only two of them."
    show: "These {digit}s are linked in pairs. Color them alternately {a} and {b}."
    w1: "Focus on the {digit}s."
    w2: "Wherever a row, column or box has only two {digit}s, one of the two must be right. The solid lines join those pairs."
    w3: "Color along the links, alternating. If every {a} cell holds a {digit}, no {b} cell does, and the other way round -- exactly one color is true."
    w4_twice: "{c1} and {c2} are both {colour} and share a unit. They can't both be {digit}, so {colour} must be the false color."
    answer_twice: "Remove the {digit} from every {colour} cell. (The {other} cells are the real {digit}s.)"
    w4_both: "Whichever color turns out true, these cells see a {digit} of each color."
    answer_both: "So they can't be {digit}. Remove it from {targets}."

  finned_x_wing:
    nudge: "There's an almost-X-Wing on the {digit}s, spoiled by a small fin."
    show: "{clean} and {finned} would form an X-Wing on {digit}, except for the fin at {fins}."
    w1: "Focus on the {digit}s."
    w2: "{clean} has the {digit} in exactly two places."
    w3: "{finned} has the {digit} in the same two {coverKinds}, plus the fin: {fins}, all inside {box}."
    w4: "If the fin isn't {digit}, it's a true X-Wing and {covers} lose their other {digit}s. If the fin is {digit}, then {box}'s {digit} is in the fin."
    answer: "The cells in both {covers} and {box} lose the {digit} either way. Remove it from {targets}."

  w_wing:
    nudge: "Two matching pairs, far apart, are tied together by a strong link: look for a W-Wing."
    show: "{a} and {b} are both {x}/{y}, and {unit} links them on {x}."
    w1: "{a} and {b} both hold only {x} and {y}, and they don't see each other."
    w2: "{unit} has only two {x}s: {la} and {lb}. One of them is the {x}."
    w3: "{a} sees {la}, and {b} sees {lb}. If {a} and {b} were both {x}, neither {la} nor {lb} could be."
    either: "That can't happen, so at least one of {a} and {b} is {y}."
    answer: "A cell that sees both {a} and {b} can't be {y}. Remove it from {targets}."

  remote_pair:
    nudge: "A chain of matching {x}/{y} pairs runs across the board."
    show: "These {n} cells all hold only {x} and {y}. Cells that see each other must differ."
    w1: "These cells all hold just {x} and {y}, and each sees at least one other."
    w2: "Cells that see each other can't match, so the chain alternates. Color it: every green cell holds one digit and every blue cell holds the other."
    w3: "So a green cell and a blue cell always hold one {x} and one {y} between them."
    answer: "A cell that sees a green cell and a blue cell can't be {x} or {y}. Remove them from {targets}."

  unique_rectangle:
    nudge: "Watch out for a deadly pattern: a rectangle of {a}/{b} pairs."
    show: "{corners} form a rectangle over two boxes, and only {odd} has extra candidates."
    w1: "{corners} form a rectangle across two boxes, and all four can be {a} or {b}."
    deadly: "If all four ended up as just {a} and {b}, you could swap every {a} with every {b} and still have a valid grid -- two solutions. A proper puzzle has exactly one, so that can't happen."
    w3: "Three corners are already just {a}/{b}. Only {odd} can still break the pattern..."
    answer: "...so {odd} can't be {a} or {b}. Remove both."

  unique_rectangle_2:
    nudge: "There's a near-deadly rectangle of {a}/{b}, and two corners share one extra candidate."
    show: "{r1} and {r2} each have one extra candidate: {x}."
    w3: "The two other corners, {r1} and {r2}, each add just one extra candidate: {x}."
    w4: "If neither were {x}, the deadly pattern would appear. So one of them is the {x}."
    answer: "A cell that sees both {r1} and {r2} can't be {x}. Remove it from {targets}."

  unique_rectangle_4:
    nudge: "There's a near-deadly rectangle of {a}/{b}, and one of its digits is locked into two corners."
    show: "In {unit}, the {d} can only go in {r1} or {r2}."
    w3: "In {unit}, the {d} can only go in {r1} or {r2}, so one of them is the {d}."
    w4: "If either of them were {e}, the four corners would be stuck on {d}/{e} -- the deadly pattern."
    answer: "So neither {r1} nor {r2} can be {e}. Remove it from both."

  bug_plus_one:
    nudge: "Every empty cell has two candidates, except one."
    show: "{cell} is the only cell with three candidates."
    w1: "Every empty cell has exactly two candidates, except {cell}, which has {digits}."
    w2: "If every cell were a pair, each digit would appear twice in every unit, and the board could be finished two ways. A proper puzzle can't end like that."
    w3: "In {cell}'s row, column and box, the {digit} appears three times -- one too many. That extra {digit} is what keeps the puzzle to one solution."
    answer: "So {cell} must be {digit}."

  xy_chain:
    nudge: "A chain of two-candidate cells links two ends that both hold {x}."
    show: "Follow this chain of two-candidate cells from {start} to {end}."
    w1: "Here's a chain of {n} cells. Each has just two candidates and sees the next."
    w2: "Suppose {start} is not {x}. Then it's {first}."
    w3: "Each link passes that on: {steps}."
    link: "{cell} is {digit}"
